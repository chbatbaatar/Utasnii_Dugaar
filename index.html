<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#667089;--bd:#e3e8f2;--ac:#1f45c4;--or:#f58220;--ac2:#e8eeff;--ok:#12a150;--dn:#d92d20;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}

.ph{display:inline-block;margin-top:3px;color:var(--ac);font-weight:600;text-decoration:none;margin-right:8px}

.act{display:flex;flex-direction:column;gap:6px}.ib{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:15px}

.mod{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
.mod.on{display:flex}.mb{background:var(--card);border-radius:16px;padding:16px;width:100%;max-width:420px;max-height:90vh;overflow:auto}

.adm{background:var(--ac2);border:1px dashed var(--ac);border-radius:10px;padding:8px;margin-top:8px;display:none;gap:8px;flex-wrap:wrap}.adm.on{display:flex}
.tt{display:flex;gap:10px;align-items:center}.logo{height:46px;background:#fff;border-radius:10px;padding:5px;flex:none}.back{background:var(--or);color:#fff;border:0;border-radius:99px;padding:9px 18px;font:inherit;font-weight:700;margin-bottom:10px;cursor:pointer}.tile{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--or);border-radius:14px;padding:16px;cursor:pointer;font-weight:700;font-size:16px;display:flex;justify-content:space-between;gap:8px}.tile small{color:var(--mu);font-weight:500}
.info{margin-top:12px}.dt{font-weight:800;font-size:17px;color:var(--ac)}.wx{display:flex;gap:14px;align-items:center;margin-top:10px;flex-wrap:wrap}.big{font-size:42px;font-weight:800;line-height:1}.wx small{color:var(--mu);display:block}.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.dy{background:var(--bg);border-radius:10px;padding:8px;text-align:center;font-size:13px}.dy b{display:block}.adv{margin:10px 0 0;padding:0;list-style:none}.adv li{padding:8px 10px;border-radius:10px;margin-top:6px;font-size:14px;background:var(--ac2)}.adv li.w{background:#fff1e0;color:#7a3d00;border-left:4px solid var(--or)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .adv li.w{background:#3a2a16;color:#ffd7ad}}.zr{margin-top:12px;border-top:1px dashed var(--bd);padding-top:10px;font-size:14px}.zr h4{margin:0 0 6px}.zr div{padding:2px 0}.note{color:var(--mu);font-size:12px;margin-top:8px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.scell{background:var(--card);border:1px solid var(--bd);border-bottom:4px solid var(--ac);border-radius:12px;padding:12px 8px;text-align:center;font-weight:700;cursor:pointer;font-size:15px}
.scell small{display:block;font-weight:500;color:var(--mu);font-size:11px;margin-top:2px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.hd h2{margin:0;font-size:22px}
.hd .mu{color:var(--mu);font-size:13px}
table.ttb{width:100%;border-collapse:collapse;font-size:12px;background:var(--card)}
.ttb th,.ttb td{border:1px solid var(--bd);padding:5px;vertical-align:top}
.ttb thead th{background:var(--ac2);color:var(--ac);font-size:12px;position:sticky;top:0}
.ttb td.p{background:var(--bg);text-align:center;white-space:nowrap;font-weight:700}
.ttb td.p small{display:block;font-weight:400;color:var(--mu);font-size:10px}
.ttb td.now{background:#fff6ec;outline:2px solid var(--or)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ttb td.now{background:#3a2a16}}
.lsn b{display:block}.lsn small{color:var(--mu);display:block;font-size:11px}
.lsn a{color:var(--ac);text-decoration:none}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--bd)}
.it{display:flex;gap:10px;background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--ac);border-radius:12px;padding:10px;margin-top:8px;align-items:flex-start}
.it.now{border-left-color:var(--or);box-shadow:0 0 0 2px var(--or)}
.it .pn{width:58px;flex:none;text-align:center}
.it .pn b{display:block;font-size:18px;color:var(--ac)}
.it .pn small{color:var(--mu);font-size:10px;display:block}
.it .ds b{font-size:16px}.it .ds small{display:block;color:var(--mu)}
.badge{display:inline-block;background:var(--or);color:#fff;border-radius:99px;font-size:11px;padding:1px 8px;margin-left:6px;vertical-align:middle}
@media print{header,.panel,#back,.noprint{display:none!important}body{background:#fff}.ttb{font-size:11px}}
</style></head><body>
<header><div class="w"><button class="back" id="back" hidden>← Буцах</button><div class="top"><div class="tt"><img class="logo" src="logo-sm.png" alt=""><div><h1 id="ttl">Алтангадас одонт ЕБ-ын I сургуулийн багш ажилчдын дугаар</h1><div class="sub" id="sb">Арвайхээр сум</div></div></div><button class="btn" id="lg">🔒 Админ</button></div>

</div></div>

<script>
const $=s=>document.querySelector(s),KEY='altan_staff_v1',PK='altan_pin_v1';
let P=[],admin=false,grp='',mode='',nid=1;
let tab='dir',SC=null,sTy='C',sEnt=null,sDay=null,sWeek=innerWidth>=820;
const ld=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=$('#ts');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),3500)}

/* ---------- navigation ---------- */
function apply(g,m,f){grp=g;mode=m;$('#fl').value=f;render()}
function nav(g,m,f){history.pushState({g,m,f},'');apply(g,m,f)}
function setTab(t){tab=t;$('#tb1').classList.toggle('on',t=='dir');$('#tb2').classList.toggle('on',t=='sch');
$('#pDir').hidden=t!='dir';$('#ls').hidden=t!='dir';$('#pSch').hidden=t!='sch';$('#sls').hidden=t!='sch';
$('#ttl').textContent=t=='dir'?'Алтангадас одонт ЕБ-ын I сургуулийн багш ажилчдын дугаар':'Алтангадас одонт ЕБ-ын I сургуулийн хичээлийн хуваарь';
t=='dir'?render():renderS()}
function snav(o){history.pushState({s:{sTy,sEnt,sDay,...o}},'');sSet(o)}
function sSet(o){if('sTy'in o)sTy=o.sTy;if('sEnt'in o)sEnt=o.sEnt;if('sDay'in o)sDay=o.sDay;renderS()}
window.addEventListener('popstate',e=>{const t=e.state||{};if(t.s){setTab('sch');sSet(t.s)}else{setTab('dir');apply(t.g||'',t.m||'',t.f||'')}});
$('#tb1').onclick=()=>setTab('dir');$('#tb2').onclick=()=>setTab('sch');

/* ---------- GitHub ---------- */
const b64=s=>btoa(unescape(encodeURIComponent(s)));
async function pushFile(path,obj){const c=ld('altan_gh');if(!c||!c.t){toast('GitHub холбоогүй. Ноорогт хадгаллаа');return false}
const u='https://api.github.com/repos/'+c.o+'/'+c.r+'/contents/'+path,h={Authorization:'Bearer '+c.t,Accept:'application/vnd.github+json'};
try{let sha=null;const g=await fetch(u,{headers:h});if(g.ok)sha=(await g.json()).sha;else if(g.status!=404)throw new Error('GET '+g.status);
const body={message:'Update '+path,content:b64(JSON.stringify(obj))};if(sha)body.sha=sha;
const r=await fetch(u,{method:'PUT',headers:h,body:JSON.stringify(body)});if(!r.ok)throw new Error('PUT '+r.status);
toast('GitHub-д хадгалагдлаа. 1-2 минутад сайт шинэчлэгдэнэ');return true}catch(e){toast('GitHub-д хадгалж чадсангүй: '+e.message);return false}}
let gtm;
function sv(){try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}clearTimeout(gtm);gtm=setTimeout(async()=>{if(await pushFile('data.json',P))try{localStorage.removeItem(KEY)}catch(e){}},700)}
function ghset(){const c=ld('altan_gh')||{o:'chbatbaatar',r:'Utasnii_Dugaar',t:''};modal('<h3>🔗 GitHub холбох</h3><label>Эзэмшигч</label><input id="g1" value="'+esc(c.o)+'"><label>Repository</label><input id="g2" value="'+esc(c.r)+'"><label>Token</label><input id="g3" type="password" placeholder="github_pat_..." value="'+esc(c.t)+'"><div class="row"><button class="btn" onclick="close_()">Болих</button><button class="btn p" id="gs">Хадгалах</button></div>');
$('#gs').onclick=()=>{try{localStorage.setItem('altan_gh',JSON.stringify({o:$('#g1').value.trim(),r:$('#g2').value.trim(),t:$('#g3').value.trim()}))}catch(e){}close();toast('GitHub холбогдлоо')}}
function dl(name,obj){const b=new Blob([JSON.stringify(obj)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove()}
function dlj(){dl('data.json',P);try{localStorage.removeItem(KEY)}catch(e){}toast('data.json татагдлаа')}

/* ---------- directory ---------- */
async function init(){try{const r=await fetch('data.json?v='+Date.now());P=await r.json()}catch(e){P=[];toast('data.json уншиж чадсангүй')}nid=P.length?Math.max(...P.map(x=>x.id))+1:1}
const G=()=>[...new Set(P.map(x=>x.g))];
const hue=g=>{let h=0;for(const ch of g)h=(h*31+ch.charCodeAt(0))%360;return h};
const WD=['Ням','Даваа','Мягмар','Лхагва','Пүрэв','Баасан','Бямба'];
function WC(c){if(c==0)return['Цэлмэг','☀️'];if(c<=3)return['Үүлэрхэг','⛅'];if(c==45||c==48)return['Манантай','🌫️'];if(c>=51&&c<=57)return['Шиврээ бороотой','🌦️'];if((c>=61&&c<=67)||(c>=80&&c<=82))return['Бороотой','🌧️'];if((c>=71&&c<=77)||c==85||c==86)return['Цастай','🌨️'];if(c>=95)return['Аадар, цахилгаантай','⛈️'];return['Үүлэрхэг','☁️']}
function adv(w){const a=[],mn=w.daily.temperature_2m_min[0],mx=w.daily.temperature_2m_max[0],ws=Math.max(w.current.wind_speed_10m,w.daily.wind_speed_10m_max[0]),g=w.current.wind_gusts_10m,pr=w.daily.precipitation_sum[0],c=w.daily.weather_code[0];
if(mn<=-20)a.push(['w','Маш хүйтэн өдөр. Зузаан хувцаслаж, гар нүүр чихээ халхлаарай. Хүүхдийг гадаа удаан байлгахгүй.']);
else if(mn<=-10)a.push(['w','Хүйтэн өдөр. Дулаан хувцаслаарай.']);
else if(mn<=0)a.push(['','Өглөө, орой хүйтэн байна. Давхарлаж хувцаслаарай.']);
if(mx>=30)a.push(['w','Халуун өдөр. Ус их уугаад нарнаас хамгаалаарай.']);
if(ws>=10||g>=15)a.push(['w','Салхи ихтэй. Машин жолоодохдоо болгоомжилж, хөнгөн зүйлээ хамгаалаарай.']);
if((c>=71&&c<=77)||c==85||c==86||(pr>0.2&&mx<=1))a.push(['w','Цас орно. Зам халтиргаатай тул удаан, болгоомжтой яваарай.']);
else if((c>=51&&c<=67)||(c>=80&&c<=82)||pr>0.5)a.push(['','Бороо орно. Шүхэр авч явна уу.']);
if(c==45||c==48)a.push(['w','Манантай. Замд үзэгдэх орчин муу байж болно.']);
if(c>=95)a.push(['w','Аадар, цахилгаан ниргэнэх магадлалтай. Задгай газар байхаас зайлсхийнэ үү.']);
if(!a.length)a.push(['','Онцгой анхааруулах зүйл алга. Сайхан өдөр болтугай!']);return a}
async function loadInfo(){const d=new Date(),el=$('#info'),key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let h='<div class="box info"><div class="dt">📅 '+d.getFullYear()+' оны '+(d.getMonth()+1)+'-р сарын '+d.getDate()+', '+WD[d.getDay()]+' гариг</div>';
try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=46.2639&longitude=102.775&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,wind_gusts_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weather_code,wind_speed_10m_max&timezone=Asia%2FUlaanbaatar&forecast_days=3&wind_speed_unit=ms');if(!r.ok)throw 0;const w=await r.json(),cw=WC(w.current.weather_code),R1=x=>Math.round(x);
h+='<div class="wx"><div style="font-size:44px">'+cw[1]+'</div><div class="big">'+R1(w.current.temperature_2m)+'°</div><div><b>Арвайхээр · '+cw[0]+'</b><small>Мэдрэгдэх '+R1(w.current.apparent_temperature)+'° · Салхи '+R1(w.current.wind_speed_10m)+' м/с</small></div></div><div class="days">'+w.daily.time.map((t,i)=>{const dd=new Date(t+'T00:00:00'),c=WC(w.daily.weather_code[i]);return '<div class="dy"><b>'+(i?WD[dd.getDay()]:'Өнөөдөр')+'</b>'+c[1]+' '+R1(w.daily.temperature_2m_min[i])+'° / '+R1(w.daily.temperature_2m_max[i])+'°</div>'}).join('')+'</div><ul class="adv">'+adv(w).map(x=>'<li class="'+x[0]+'">'+(x[0]?'⚠️ ':'💡 ')+x[1]+'</li>').join('')+'</ul><div class="note">Мэдээ: Open-Meteo (автомат прогноз). Албан ёсны анхааруулгыг Цаг уур, орчны шинжилгээний газраас шалгана уу.</div>'}catch(e){h+='<div class="note">Цаг агаарын мэдээг одоогоор авч чадсангүй.</div>'}
let z=null;try{const r=await fetch('zurkhai.json?v='+Date.now());if(r.ok)z=(await r.json())[key]}catch(e){}

/* ---------- aSc XML parser ---------- */
function sp(el,a){const v=el.getAttribute(a)||'';return v.split(',').map(s=>s.trim()).filter(Boolean)}
function badCount(t){return (t.match(/\uFFFD|пїЅ|ï¿½/g)||[]).length*10+(t.match(/[РСÐÑ][\u0080-\u04FF]/g)||[]).length}
function decodeBest(buf,enc){let best=null;
for(const c of [enc,'utf-8','windows-1251']){let t;try{t=new TextDecoder(c).decode(buf)}catch(e){continue}
const b=badCount(t),raw=(t.match(/\uFFFD|пїЅ|ï¿½/g)||[]).length;if(!best||b<best.b)best={t,b,c,raw};if(b==0)break}
return best||{t:new TextDecoder('utf-8').decode(buf),b:0,raw:0,c:'utf-8'}}
const natural=(a,b)=>{const f=s=>{const m=String(s).match(/^(\d+)(.*)$/);return m?[+m[1],m[2]]:[9999,String(s)]};
const x=f(a),y=f(b);return x[0]-y[0]||String(x[1]).localeCompare(String(y[1]),'mn')};
function parseAsc(buf){const head=new TextDecoder('ascii').decode(buf.slice(0,400));
let enc=((head.match(/encoding="([^"]+)"/i)||[])[1]||'utf-8').toLowerCase();
const dec=decodeBest(buf,enc);let txt=dec.t;
txt=txt.replace(/^\uFEFF/,'').replace(/<\?xml[^>]*\?>/,'<?xml version="1.0"?>');
const doc=new DOMParser().parseFromString(txt,'text/xml');
if(doc.getElementsByTagName('parsererror').length)throw new Error('XML бүтэц уншигдсангүй');
const A=t=>[].slice.call(doc.getElementsByTagName(t));
const per=A('period').map(p=>({p:p.getAttribute('period'),n:p.getAttribute('short')||p.getAttribute('name'),s:p.getAttribute('starttime')||'',e:p.getAttribute('endtime')||''})).filter(p=>p.p!=null);
if(!per.length)throw new Error('Цагийн хуваарь (periods) олдсонгүй');
let fixed=0;const MAP={v:'ү',Y:'Ү',e:'ө',E:'Ө'};
const fx=s=>String(s==null?'':s).replace(/\S+/g,w=>/[\u0400-\u04FF]/.test(w)?w.replace(/[vYeE]/g,c=>{fixed++;return MAP[c]}):w);
const nm={},gr={},les={};
['subject','teacher','classroom','class'].forEach(t=>{nm[t]={};A(t).forEach(x=>{nm[t][x.getAttribute('id')]=fx((x.getAttribute('name')||x.getAttribute('short')||'').trim())})});
A('group').forEach(x=>gr[x.getAttribute('id')]={n:fx((x.getAttribute('name')||'').trim()),e:x.getAttribute('entireclass')=='1'});
A('lesson').forEach(x=>les[x.getAttribute('id')]={c:sp(x,'classids'),t:sp(x,'teacherids'),r:sp(x,'classroomids'),g:sp(x,'groupids'),s:x.getAttribute('subjectid')});
const uC={},uT={},uR={},uJ={},cards=[];
A('card').forEach(cd=>{const le=les[cd.getAttribute('lessonid')];if(!le)return;
const days=cd.getAttribute('days')||'',rooms=sp(cd,'classroomids'),rr=rooms.length?rooms:le.r,dd=[];
for(let d=0;d<days.length&&d<5;d++)if(days[d]=='1')dd.push(d);
if(!dd.length)return;
le.c.forEach(i=>uC[i]=1);le.t.forEach(i=>uT[i]=1);rr.forEach(i=>uR[i]=1);if(le.s)uJ[le.s]=1;
cards.push({d:dd,p:cd.getAttribute('period'),c:le.c,t:le.t,r:rr,s:le.s,g:le.g})});
if(!cards.length)throw new Error('Хичээлийн хуваарь (cards) олдсонгүй');
let dup=0;
const idx=(used,names,nat)=>{const arr=Object.keys(used).map(id=>[id,(names[id]||'').trim()||'—']);
arr.sort((a,b)=>nat?natural(a[1],b[1]):String(a[1]).localeCompare(String(b[1]),'mn'));
const seen={},map={},labels=[];
arr.forEach(a=>{let n=a[1];if(seen[n]){seen[n]++;dup++;n=n+' ('+seen[n]+')'}else seen[n]=1;map[a[0]]=labels.length;labels.push(n)});
return {map,labels}};
const IC=idx(uC,nm['class'],true),IT=idx(uT,nm['teacher'],false),IR=idx(uR,nm['classroom'],true),IJ=idx(uJ,nm['subject'],false);
const mp=(a,m)=>a.map(i=>m[i]).filter(v=>v!==undefined).sort((x,y)=>x-y);
const L=[];
cards.forEach(r=>{const ci=mp(r.c,IC.map),ti=mp(r.t,IT.map),ri=mp(r.r,IR.map);
const si=IJ.map[r.s];const g=r.g.map(id=>gr[id]).filter(x=>x&&!x.e).map(x=>x.n).filter(Boolean).join(', ');
r.d.forEach(d=>L.push({d,p:r.p,s:si===undefined?-1:si,c:ci,t:ti,r:ri,g}))});
const d=new Date(),u=d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');
const used=per.filter(p=>L.some(x=>x.p==p.p));
return {o:{u,P:used,C:IC.labels,T:IT.labels,R:IR.labels,J:IJ.labels,L},bad:dec.raw||0,enc:dec.c,dup,fixed}}

$('#sv').onclick=()=>{let g=$('#e4').value;if(g=='__n')g=$('#e5').value.trim();const n=$('#e1').value.trim();if(!n||!g)return toast('Нэр, бүлгээ бөглөнө үү');
const o={n,p:$('#e2').value.trim(),c:$('#e3').value.trim().toUpperCase(),g};if(id)Object.assign(x,o);else P.push({id:nid++,...o});sv();close();render();toast('Хадгалагдлаа')};
if(id)$('#dl').onclick=()=>{if(confirm('Устгах уу?')){P=P.filter(p=>p.id!=id);sv();close();render()}}}
function backup(){modal('<h3>💾 Нөөцлөх / Сэргээх</h3><label>Өгөгдөл (JSON). Хуулж хадгалах эсвэл буцаан буулгаж сэргээнэ</label><textarea id="js" rows="8">'+esc(JSON.stringify(P))+'</textarea><div class="row"><button class="btn" onclick="close_()">Хаах</button><button class="btn p" id="im">Сэргээх</button></div>');
$('#im').onclick=()=>{try{const a=JSON.parse($('#js').value);if(!Array.isArray(a))throw 0;P=a.map((x,i)=>({id:i+1,n:x.n,p:x.p,g:x.g,c:x.c||''}));nid=P.length+1;sv();close();render();toast('Сэргээгдлээ')}catch(e){toast('JSON буруу байна')}}}
$('#lg').onclick=()=>{if(admin){admin=false;$('#ad').classList.remove('on');$('#ad2').classList.remove('on');$('#lg').textContent='🔒 Админ';tab=='dir'?render():renderS()}else login()};
$('#add').onclick=()=>edit();$('#bk').onclick=backup;$('#dj').onclick=dlj;$('#gh').onclick=ghset;$('#gh2').onclick=ghset;$('#imx').onclick=importXml;
$('#dsj').onclick=()=>{if(SC)dl('schedule.json',SC);else toast('Хуваарь алга')};
$('#pn').onclick=()=>{modal('<h3>🔑 PIN солих</h3><input id="np" type="password" inputmode="numeric" placeholder="Шинэ PIN"><div class="row"><button class="btn" onclick="close_()">Болих</button><button class="btn p" id="ok">Хадгалах</button></div>');$('#ok').onclick=()=>{const v=$('#np').value.trim();if(v.length<4)return toast('PIN 4+ тэмдэгт');try{localStorage.setItem(PK,v)}catch(e){}close();toast('PIN солигдлоо')}};
$('#md').onclick=e=>{if(e.target.id=='md')close()};
['q','vw','so','fl'].forEach(i=>$('#'+i).oninput=render);
$('#sq').oninput=renderS;
document.addEventListener('click',e=>{const t=e.target.closest('[data-g],[data-ed],[data-cp],[data-s],[data-ty],[data-ent],[data-day],[data-go],[data-free],#back');if(!t)return;
if(t.id=='back'){if(tab=='sch'){if(sEnt!==null)snav({sEnt:null,sDay:null});else setTab('dir')}else if(history.state)history.back();else nav('','','');return}
if(t.dataset.free){e.preventDefault();return freeRooms()}
if(t.dataset.go){e.preventDefault();const a=t.dataset.go.split('|');return snav({sTy:a[0],sEnt:a[1],sDay:null})}
if(t.dataset.ty!==undefined&&tab=='sch'){e.preventDefault();return snav({sTy:t.dataset.ty,sEnt:null,sDay:null})}
if(t.dataset.ent!==undefined)return snav({sEnt:t.dataset.ent,sDay:null});
if(t.dataset.day!==undefined)return sSet({sDay:+t.dataset.day});
if(t.dataset.s){const k=t.dataset.s;return nav('',k=='grp'?'groups':'',k=='car'?'c':'')}
if(t.dataset.g!==undefined)return nav(t.dataset.g,'',$('#fl').value);
if(t.dataset.ed)return edit(t.dataset.ed);
const x=P.find(p=>p.id==t.dataset.cp);if(x){try{navigator.clipboard.writeText(x.n+' '+x.p+(x.c?' '+x.c:''));toast('Хуулагдлаа')}catch(e2){toast('Хуулж чадсангүй')}}});
setInterval(()=>{if(tab=='sch'&&sEnt!==null)renderS()},60000);
Promise.all([init(),initSch()]).then(()=>{render();loadInfo()});
</script></body></html>
